  p = abs(p);
  return (p.x+p.y+p.z-s)*0.57735027;
}

float sdTorus( vec3 p, vec2 t ) {
  vec2 q = vec2(length(p.xz)-t.x,p.y);
  return length(q)-t.y;
}

float map(vec3 pos) {
    float spacing = u_spacing;
    
    // Local coordinates within the grid cell
    vec3 p = mod(pos, spacing) - spacing * 0.5;

    // Dynamic Tunnel: Shapes move away as the player approaches
    // We calculate the distance from the player's path (z-axis)
    float distToPath = length(pos.xy);
    
    // Repulsion logic: physically shift the grid cell center
    float repulsionRange = 5.0;
    float repulsionStrength = 4.0;
    float repulsion = smoothstep(repulsionRange, 0.0, distToPath);
    
    // Shift the local position p away from the center by moving the origin of the cell
    if (distToPath > 0.001) {
        vec2 dir = normalize(pos.xy);
        p.xy -= dir * repulsion * repulsionStrength;
    }

    // Rotate individual shapes
    float morphTime = iTime * u_morphIntensity;
    vec3 grid = floor(pos / spacing);
    p = xrot(morphTime * 0.4 + grid.x) * yrot(morphTime * 0.3 + grid.y) * p;
    
    float s = u_shapeSize;
    
    // Use standard shapes
    float dSphere = length(p) - s * 0.75;
    float dBox = sdBox(p, vec3(s * 0.6));
    float dOct = sdOctahedron(p, s * 0.9);
    float dTorus = sdTorus(p, vec2(s * 0.6, s * 0.2));
    
    // Linear mixing for cleaner transitions between solid shapes
    float m1 = sin(morphTime * 0.7 + grid.z) * 0.5 + 0.5;
    float m2 = cos(morphTime * 1.1 + grid.x) * 0.5 + 0.5;
    
    float d = mix(dSphere, dBox, m1);
    d = mix(d, dOct, m2);
    d = mix(d, dTorus, m1 * m2);
    
    // Removed jelly surface distortion
    // d += sin(p.x * 10.0 + iTime * 5.0) * 0.02 * u_morphIntensity;
    
    return d * 0.5;
}

vec3 surfaceNormal(vec3 pos) {
    vec3 delta = vec3(0.01, 0.0, 0.0);
    vec3 normal;
    normal.x = map(pos + delta.xyz) - map(pos - delta.xyz);
    normal.y = map(pos + delta.yxz) - map(pos - delta.yxz);
    normal.z = map(pos + delta.zyx) - map(pos - delta.zyx);
    return normalize(normal);
}

vec3 palette(float t) {
    // High-contrast neon palette
    vec3 a = vec3(0.5, 0.5, 0.5);
    vec3 b = vec3(0.5, 0.5, 0.5);
    vec3 c = vec3(1.0, 1.0, 1.0);
    vec3 d = vec3(0.0, 0.33, 0.67);
    return a + b * cos(6.28318 * (c * t + d));
}

void main() {
    vec2 uv = gl_FragCoord.xy / iResolution.xy;
    uv = uv * 2.0 - 1.0;
    uv.x *= iResolution.x / iResolution.y;
    
    vec3 eye = normalize(vec3(uv, 1.0));
    // Apply look rotation
    eye = eye * yrot(u_look.x) * xrot(u_look.y);
    
    // Move forward through the field
    vec3 origin = vec3(0.0, 0.0, iTime * u_speed * 5.0);
    
    float t = 0.0;
    float d = 0.0;
    
    // Raymarching
    for (int i = 0; i < 64; ++i) {
        vec3 pos = origin + eye * t;
        d = map(pos);
        if (d < 0.001 || t > 40.0) break;
        t += d;
    }
    
    vec3 final = u_bgColor;
    
    if (t < 40.0) {
        vec3 worldPos = origin + eye * t;
        vec3 norm = surfaceNormal(worldPos);
        
        // Color based on position and time
        float colorShift = length(worldPos * 0.05) + iTime * u_chromaSpeed * 0.1;
        vec3 baseCol = palette(colorShift);
        
        float diff = max(0.0, dot(norm, -eye));
        float rim = pow(1.0 - max(0.0, dot(norm, -eye)), 3.0);
        
        // Neon glow and shading
        final = baseCol * (diff * 0.5 + 0.5);
        final += baseCol * rim * u_neonGlow * 2.0; // Stronger glow
        
        // Fog/Distance fade
        float fog = exp(-t * 0.05);
        final = mix(u_bgColor, final, fog);
    }
    
    gl_FragColor = vec4(final, 1.0);
}
